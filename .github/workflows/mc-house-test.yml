
name: MC.HOUSE VPN Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;30.0.16248370" || true
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Configure NDK
        run: |
          sed -i '10i\
          \
              ndkVersion = "30.0.16248370"' V2rayNG/app/build.gradle.kts

      - name: Build tunnel library
        run: bash compile-hevtun.sh

      - name: Copy tunnel library
        run: cp -r libs V2rayNG/app/

      - name: Get Xray library version
        run: |
          cd AndroidLibXrayLite
          TAG=$(git describe --tags --abbrev=0)
          echo "XRAY_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download Xray library
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.XRAY_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Build Debug APK
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MC-HOUSE-VPN-Debug
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
